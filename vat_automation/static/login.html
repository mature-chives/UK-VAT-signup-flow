<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · GOV.UK 注册助手</title>
  <style>
    :root { color-scheme:light; --ink:#18212b; --muted:#66717d; --blue:#1d70b8; --green:#00703c; --red:#d4351c; --bg:#f3f5f7; --line:#d6dbe0; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { background:#0b0c0c; color:white; padding:18px 0; }
    header div { width:min(1080px,calc(100% - 32px)); margin:auto; }
    header strong { font-size:22px; }
    main { width:min(420px,calc(100% - 32px)); margin:64px auto; }
    .card { background:white; border:1px solid var(--line); border-radius:10px; padding:28px; box-shadow:0 2px 10px #0000000d; }
    h1 { margin:0 0 20px; font-size:26px; line-height:1.25; }
    label { display:block; font-weight:650; margin:16px 0 6px; }
    input { width:100%; padding:10px 12px; border:2px solid #505a5f; border-radius:3px; font:inherit; background:white; }
    input:focus { outline:3px solid #ffdd00; border-color:#0b0c0c; }
    button { width:100%; margin-top:22px; padding:11px 18px; border:0; border-radius:3px; background:var(--green); color:white; font:700 16px inherit; cursor:pointer; box-shadow:0 2px 0 #003d20; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .message { min-height:22px; margin-top:12px; font-size:14px; }
    .message.error { color:var(--red); }
    .notice { padding:12px 14px; margin-bottom:20px; font-size:14px; background:#e8f4ee; border-left:5px solid var(--green); color:#004f2d; }
  </style>
</head>
<body>
<header><div><strong>GOV.UK 注册助手</strong></div></header>
<main>
  <section class="card">
    <h1>登录</h1>
    <div class="notice">本服务处理 HMRC 登录凭据和客户身份证件，仅限授权同事使用。</div>
    <form id="login-form">
      <label for="username">用户名</label>
      <input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <label for="password">密码</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="submit" type="submit">登录</button>
      <div id="error" class="message error"></div>
    </form>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);

$('login-form').addEventListener('submit', async event => {
  event.preventDefault();
  $('error').textContent = '';
  $('submit').disabled = true;
  try {
    const response = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({username: $('username').value, password: $('password').value})
    });
    const body = await response.json();
    if (!response.ok) throw new Error(body.detail || '登录失败');
    $('password').value = '';
    window.location.href = '/';
  } catch (error) {
    $('error').textContent = error.message;
    $('submit').disabled = false;
  }
});
</script>
</body>
</html>
