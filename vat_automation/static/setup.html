<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>初始化 · GOV.UK 注册助手</title>
  <style>
    :root { color-scheme:light; --ink:#18212b; --muted:#66717d; --blue:#1d70b8; --green:#00703c; --red:#d4351c; --bg:#f3f5f7; --line:#d6dbe0; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    header { background:#0b0c0c; color:white; padding:18px 0; }
    header div { width:min(1080px,calc(100% - 32px)); margin:auto; }
    header strong { font-size:22px; }
    main { width:min(460px,calc(100% - 32px)); margin:56px auto; }
    .card { background:white; border:1px solid var(--line); border-radius:10px; padding:28px; box-shadow:0 2px 10px #0000000d; }
    h1 { margin:0 0 20px; font-size:26px; line-height:1.25; }
    label { display:block; font-weight:650; margin:16px 0 6px; }
    input { width:100%; padding:10px 12px; border:2px solid #505a5f; border-radius:3px; font:inherit; background:white; }
    input:focus { outline:3px solid #ffdd00; border-color:#0b0c0c; }
    button { width:100%; margin-top:22px; padding:11px 18px; border:0; border-radius:3px; background:var(--green); color:white; font:700 16px inherit; cursor:pointer; box-shadow:0 2px 0 #003d20; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    .message { min-height:22px; margin-top:12px; font-size:14px; }
    .message.error { color:var(--red); }
    .hint { color:var(--muted); font-size:14px; margin-top:5px; }
    .notice { padding:12px 14px; margin-bottom:20px; font-size:14px; background:#fff7bf; border-left:5px solid #ffdd00; }
  </style>
</head>
<body>
<header><div><strong>GOV.UK 注册助手</strong></div></header>
<main>
  <section class="card">
    <h1>创建管理员账号</h1>
    <div class="notice">初始化码显示在启动 <code>vat-web</code> 的终端里，每次启动重新生成。凭它创建的账号是管理员，之后可在页面上为同事添加账号。</div>
    <form id="setup-form">
      <label for="token">初始化码</label>
      <input id="token" autocomplete="off" autocapitalize="none" spellcheck="false" required>
      <label for="username">管理员用户名</label>
      <input id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      <div class="hint">小写字母、数字、点、下划线或短横线，2-32 个字符。</div>
      <label for="password">密码</label>
      <input id="password" type="password" autocomplete="new-password" required minlength="12">
      <label for="password2">再次输入密码</label>
      <input id="password2" type="password" autocomplete="new-password" required minlength="12">
      <div class="hint">密码至少 12 个字符。</div>
      <button id="submit" type="submit">创建并进入</button>
      <div id="error" class="message error"></div>
    </form>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);

$('setup-form').addEventListener('submit', async event => {
  event.preventDefault();
  $('error').textContent = '';
  if ($('password').value !== $('password2').value) {
    $('error').textContent = '两次输入的密码不一致。';
    return;
  }
  $('submit').disabled = true;
  try {
    const response = await fetch('/api/setup', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({token: $('token').value.trim(), username: $('username').value, password: $('password').value})
    });
    const body = await response.json();
    if (!response.ok) throw new Error(body.detail || '初始化失败');
    window.location.href = '/';
  } catch (error) {
    $('error').textContent = error.message;
    $('submit').disabled = false;
  }
});
</script>
</body>
</html>
