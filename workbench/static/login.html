<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 · 销售交付工作台</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="app-header auth-header">
  <div class="bar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <div>
        <strong>销售交付工作台</strong>
        <small>销售与交付同一套菜单</small>
      </div>
    </div>
  </div>
</header>
<main class="auth-main">
  <section class="card auth-card">
    <h1>登录</h1>
    <p class="lede">用内部账号进入。英国 VAT 的 Chrome 只在服务器上跑，网页只看状态和验证码。</p>
    <div class="notice ok">客户资料可在多个业务间复用。新业务以插件登记，不必改菜单结构。</div>
    <form id="login-form">
      <label for="username">用户名</label>
      <input id="username" autocomplete="username" autocapitalize="none" required>
      <label for="password">密码</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button id="submit" type="submit">登录</button>
      <div id="error" class="msg error" role="alert"></div>
    </form>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);
$("login-form").addEventListener("submit", async event => {
  event.preventDefault();
  $("error").textContent = "";
  $("submit").disabled = true;
  try {
    const response = await fetch("/api/login", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({username: $("username").value, password: $("password").value})
    });
    const body = await response.json();
    if (!response.ok) throw new Error(body.detail || "登录失败");
    window.location.replace("/");
  } catch (error) {
    $("error").textContent = error.message;
    $("submit").disabled = false;
  }
});
</script>
</body>
</html>
