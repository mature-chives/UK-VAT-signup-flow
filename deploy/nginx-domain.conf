# tCloud 宿主机独立站点：/etc/nginx/sites-available/uk-vat-signup
server {
    listen 80;
    server_name uk.amberaccount.cn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/uk-vat-acme;
        default_type text/plain;
    }
    location / {
        return 301 https://uk.amberaccount.cn$request_uri;
    }
    access_log off;
}

server {
    listen 443 ssl;
    server_name uk.amberaccount.cn;

    ssl_certificate /etc/letsencrypt/live/uk.amberaccount.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/uk.amberaccount.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 100m;
    access_log off;

    location / {
        proxy_pass https://127.0.0.1:16671;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_ssl_trusted_certificate /home/ubuntu/uk-vat-signup/certs/server.crt;
        proxy_ssl_verify on;
        proxy_ssl_name localhost;
    }
}
