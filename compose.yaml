name: uk-vat-signup
services:
  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    init: true
    restart: unless-stopped
    working_dir: /app
    environment:
      VAT_PUBLIC_HOST: ${VAT_PUBLIC_HOST:-43.162.101.208}
    volumes:
      # editable 安装保持项目根目录一致，私有存储随服务器目录持久化。
      - .:/app
    shm_size: 512mb
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl, urllib.request; urllib.request.urlopen('https://127.0.0.1:8765/login', context=ssl._create_unverified_context(), timeout=5).close()"]
      interval: 15s
      timeout: 6s
      start_period: 30s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "${VAT_HTTPS_PORT:-16671}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/tls:ro
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
